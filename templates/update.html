
{% extends 'base.html' %}
{% block body %}
        

   
      <div class="container">
        <h2>Update your list</h2>
        <form class="my-3"action="/update/{{todo.sno}}" method="POST">
        <div class="mb-3">
            <label for="title" class="form-label">Todo point</label>
            <input type="text" class="form-control" name="title" id="title" value="{{todo.title}}">
          </div>
          <div class="mb-3">
            <label for="desc" class="form-label" >Description</label>
            <input type="text" class="form-control" id="desc" value="{{todo.desc}}" name="desc">
          </div>
          <div>
            <button type="submit" class="btn btn-dark">Update</button>
          </div>
          </form>
      </div>

     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% endblock body %}
